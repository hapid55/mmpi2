function home(){return page('Asesmen MMPI-2 Digital','Simulasi antarmuka pengisian 567 butir dan modul interpretasi psikometrik berbahasa Indonesia.',`<div class="hero"><div class="eyebrow" style="color:#dbbb83">MINNESOTA MULTIPHASIC PERSONALITY INVENTORY-2</div><h2>Pengalaman asesmen yang terstruktur, profesional, dan mudah digunakan.</h2><p>567 pernyataan disajikan secara berurutan. Respons disimpan hanya di perangkat ini. Laporan psikometrik menggunakan data T-score demonstrasi atau input skor resmi secara terpisah.</p><div class="controlrow" style="margin-top:23px"><button class="btn ghost" onclick="go('tes')">${count()?'Lanjutkan pengisian':'Mulai simulasi'} →</button><button class="btn transparent" onclick="go('laporan')">Lihat contoh interpretasi</button></div></div><div class="grid" style="margin-top:18px"><div class="card metric"><div class="k">Butir instrumen</div><div class="num">567</div><div class="sub">Seluruh nomor soal tersedia</div></div><div class="card metric"><div class="k">Respons terisi</div><div class="num">${count()}<span style="font-size:16px;color:#8c9ab0"> / 567</span></div><div class="sub">${pct()}% progres pengisian</div></div><div class="card metric"><div class="k">Skala dalam profil</div><div class="num">17</div><div class="sub">7 validitas + 10 klinis (demo)</div></div></div><div class="two" style="margin-top:18px"><div class="card"><h3 class="sectiontitle">Progres simulasi</h3><div style="display:flex;justify-content:space-between;margin-bottom:8px"><span class="muted small">Soal yang telah dijawab</span><b>${pct()}%</b></div><div class="progress"><i style="width:${pct()}%"></i></div><p class="small muted">${567-count()} pertanyaan belum dijawab. Semua jawaban dapat diedit sebelum diekspor.</p><button class="btn tiny" onclick="go('respons')">Buka rekap respons</button></div><div class="note"><b>Ketentuan penggunaan</b><p class="small">Redaksi Indonesia merupakan terjemahan kerja nonresmi. Aplikasi ini bukan administrasi MMPI-2 tersta function test(){const i=state.idx,sec=Math.floor(i/48),nSections=Math.ceil(567/48),start=sec*48,end=Math.min(start+48,567);return page('Pengisian Kuesioner','Pilih Benar jika pernyataan secara umum sesuai dengan diri Anda; pilih Salah jika tidak sesuai.',`<div class="two"><div class="stack"><div class="card"><div class="questiontop"><div><span class="qnumber">BUTIR ${String(i+1).padStart(3,'0')} / 567</span><div class="small muted" style="margin-top:10px">Bagian ${sec+1} dari ${nSections} &nbsp;·&nbsp; ${count()} jawaban terisi</div></div><div style="font-weight:800;color:#546b94">${pct()}%</div></div><div class="progress"><i style="width:${pct()}%"></i></div><div class="qtext">${esc(QUESTIONS[i])}</div><div class="choices"><button class="choice ${state.answers[i]===true?'selected':''}" onclick="answer(true)">Benar <span class="circle">${state.answers[i]===true?'✓':''}</span></button><button class="choice ${state.answers[i]===false?'selected':''}" onclick="answer(false)">Salah <span class="circle">${state.answers[i]===false?'✓':''}</span></button></div><div class="qfooter"><button class="btn ghost" onclick="setQ(${i-1})" ${i===0?'disabled':''}>← Sebelumnya</button><button class="btn ghost" onclick="nextUnanswered()">Soal belum terjawab</button><button class="btn" onclick="setQ(${i+1})" ${i===566?'disabled':''}>Berikutnya →</button></div></div><div class="notice small"><b>Privasi dan keselamatan:</b> Sejumlah pernyataan menyinggung pengalaman traumatis, kesehatan mental, atau pikiran menyakiti diri. Aplikasi tidak memantau keselamatan maupun menggantikan tenaga kesehatan. Bila sedang mengalami risiko langsung, hubungi bantuan darurat setempat atau profesional kesehatan.</div></div><div class="card"><h3 class="sectiontitle">Navigasi butir</h3><div class="formfield" style="margin-bottom:14px"><label for="jump">Langsung ke nomor</label><input id="jump" type="number" min="1" max="567" placeholder="Masukkan nomor 1–567" onkeydown="if(event.key==='Enter')setQ((+this.value||1)-1)"></div><div class="filterrow"><select id="sectionPick" aria-label="Pilih bagian" onchange="setQ(+this.value*48)">${Array.from({length:nSections},(_,j)=>`<option value="${j}" ${j===sec?'selected':''}>Bagian ${j+1} · ${j*48+1}–${Math.min(567,(j+1)*48)}</option>`).join('')}</select><button class="btn tiny ghost" onclick="setQ((+el('jump').value||1)-1)">Pergi</button></div><div class="qgrid">${Array.from({length:end-start},(_,j)=>{let q=start+j;return `<button class="${state.answers[q]!==null?'done':''} ${q===i?'current':''}" onclick="setQ(${q})" title="Butir ${q+1}">${q+1}</button>`}).join('')}</div><hr class="hr"><div class="small muted">Legenda: <span style="color:#16866d">■</span> Sudah dijawab &nbsp; <span style="color:#8f9db3">□</span> Belum dijawab</div><div class="controlrow" style="margin-top:18px"><button class="btn ghost tiny" onclick="go('respons')">Lihat semua respons</button></div></div></div>`)}
function responses(){const a=state.answers.filter(x=>x===true).length,b=state.answers.filter(x=>x===false).length,blank=567-a-b;const items=QUESTIONS.map((q,i)=>({q,i})).filter(({q,i})=>state.filter==='semua'||(state.filter==='kosong'&&state.answers[i]===null)||(state.filter==='terisi'&&state.answers[i]!==null));return page('Rekap Respons','Periksa jawaban, temukan soal yang terlewat, lalu ekspor data dalam format JSON.',`<div class="grid"><div class="card metric"><div class="k">Benar</div><div class="num">${a}</div></div><div class="card metric"><div class="k">Salah</div><div class="num">${b}</div></div><div class="card metric"><div class="k">Belum dijawab</div><div class="num">${blank}</div></div></div><div class="card" style="margin-top:18px"><div class="controlrow" style="justify-content:space-between;margin-bottom:17px"><div class="segment">${['semua','terisi','kosong'].map(x=>`<button class="seg ${state.filter===x?'on':''}" onclick="state.filter='${x}';render()">${{semua:'Semua (567)',terisi:'Terisi',kosong:'Belum dijawab'}[x]}</button>`).join('')}</div><div class="controlrow"><button class="btn ghost tiny" onclick="exportJson()">↓ Ekspor JSON</button><button class="btn ghost tiny" onclick="el('importFile').click()">↑ Impor JSON</button><button class="btn ghost tiny" onclick="if(confirm('Hapus semua respons lokal?')){state.answers=Array(567).fill(null);persist();render()}">Hapus respons</button></div></div><div class="tablewrap" style="max-height:650px;overflow:auto"><table class="table"><thead><tr><th style="width:72px">No.</th><th>Pernyataan</th><th style="width:100px">Respons</th><th style="width:95px">Tindakan</th></tr></thead><tbody>${items.map(({q,i})=>`<tr><td>${i+1}</td><td>${esc(q)}</td><td>${state.answers[i]===null?'<span class="flag">Belum diisi</span>':state.answers[i]===true?'<span class="flag neutral">Benar</span>':'<span class="flag low">Salah</span>'}</td><td><button class="btn ghost tiny" onclick="setQ(${i})">Edit</button></td></tr>`).join('')}</tbody></table></div></div><p class="small muted">Sebaran jawaban Benar/Salah merupakan statistik pengisian semata, bukan ukuran kepribadian atau validitas MMPI-2.</p>`)}
function exportJson(){const data={jenis:'SIMULASI_MMPI2_NONRESMI',tanggal:new Date().toISOString(),versi:'id-demo-1',jumlah_butir:567,respons:state.answers.map((v,i)=>({nomor:i+1,jawaban:v===null?null:v?'Benar':'Salah'}))};const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download='respons-simulasi-mmpi2.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
el('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const p=JSON.parse(await f.text());if(!Array.isArray(p.respons)||p.respons.length!==567)throw Error('Berkas harus berisi 567 jawaban');state.answers=p.respons.map(x=>x.jawaban==='Benar'?true:x.jawaban==='Salah'?false:null);persist();render();alert('Data berhasil diimpor.')}catch(e){alert('Impor gagal: '+e.message)}e.target.value=''});
function scoreVal(k){const n=Number(state.scores[k]);return Number.isFinite(n)?n:null}
function assess(k,n){if(n===null)return['Tidak tersedia','—'];if(n>=65)return['Elevasi menonjol','high'];if(n>=58)return['Elevasi ringan–sedang','high'];if(n<40)return['Relatif rendah','low'];return['Rentang pembanding umum','neutral']}
function validity(){const s=state.scores;const needed=['L','F','Fb','K','VRIN','TRIN','S'];const avail=needed.every(k=>scoreVal(k)!==null);if(!avail)return {status:'Belum dapat dinilai',desc:'Skala validitas belum tersedia seluruhnya; interpretasi klinis harus ditangguhkan.',warn:true};if(scoreVal('VRIN')>=80||scoreVal('TRIN')>=80||scoreVal('F')>=100||scoreVal('Fb')>=110)return {status:'Indikasi ketidakvalidan',desc:'Satu atau lebih indikator contoh melewati ambang kehati-hatian dari referensi lama. Hentikan interpretasi klinis dan minta verifikasi profesional.',warn:true};if(scoreVal('VRIN')>=70||scoreVal('TRIN')>=70||scoreVal('L')>=65||scoreVal('K')>=65||scoreVal('F')>=80||scoreVal('Fb')>=90)return{status:'Perlu evaluasi mendalam',desc:'Terdapat elevasi skala validitas yang menuntut penelaahan pola respons, konteks, manual, dan norma yang digunakan.',warn:true};return{status:'Tidak tampak sinyal ekstrem pada indikator contoh',desc:'Angka demonstrasi tidak menunjukkan elevasi ekstrem menurut kerangka ilustratif. Hal ini tidak membuktikan protokol valid tanpa pemeriksaan skoring resmi.',warn:false}}
function analysis(){const scores=state.scores;const v=validity();const clinical=names.map((k,i)=>({k,name:full[i],n:scoreVal(k),desc:construct[i],comment:commentary[i]}));const elevated=clinical.filter(x=>x.n!==null&&x.n>=65&&x.k!=='Mf'&&x.k!=='Si').sort((a,b)=>b.n-a.n);const code=elevated.length>=2?`${elevated[0].k}-${elevated[1].k}`:'Tidak dapat ditetapkan';const reportAllowed=!v.warn;return page('Analisis & Interpretasi Profil','Laporan 10 bagian dengan pemeriksaan validitas lebih dahulu. Semua angka demo bersifat ilustratif, bukan hasil skoring respons.',`<div class="card noprint" style="margin-bottom:18px"><div class="controlrow" style="justify-content:space-between"><div><div class="eyebrow">SUMBER SKOR</div><b>Pilih jenis profil yang dianalisis</b></div><div class="controlrow"><button class="seg ${state.mode==='demo'?'on':''}" onclick="state.mode='demo';state.scores={...sample};persist();render()">Profil fiktif</button><button class="seg ${state.mode==='manual'?'on':''}" onclick="state.mode='manual';persist();render()">Input T-score profesional</button><button class="btn tiny ghost" onclick="window.print()">⎙ Cetak laporan</button></div></div><p class="small muted">Perubahan jawaban pada 567 butir <b>tidak mengubah</b> T-score. Input manual hanya untuk nilai yang telah dihitung melalui metode skoring resmi.</p>${state.mode==='manual'?`<div class="scoregrid" style="margin-top:16px">${KEYS.map(k=>`<div class="scoreitem"><label>${k}</label><small>${names.includes(k)?full[names.indexOf(k)]:'Skala validitas'}</small><input type="number" min="0" max="140" value="${scoreVal(k)??''}" onchange="updateScore('${k}',this.value)"></div>`).join('')}</div><p class="small muted">Isi hanya T-score yang diverifikasi. Contoh awal masih ditampilkan sampai diubah; bersihkan seluruh kolom sebelum memasukkan profil baru jika diperlukan.</p><button class="btn tiny ghost" onclick="state.scores=Object.fromEntries(KEYS.map(k=>[k,null]));persist();render()">Kosongkan seluruh T-score</button>`:''}</div><div class="grid"><div class="card metric"><div class="k">Status protokol</div><div class="num" style="font-size:19px;margin-top:12px">${v.status}</div><div class="sub">Validitas belum diverifikasi secara resmi</div></div><div class="card metric"><div class="k">Elevasi klinis ≥ 65 (di luar Mf, Si)</div><div class="num">${elevated.length}</div><div class="sub">Hanya klasifikasi ilustratif</div></div><div class="card metric"><div class="k">Pasangan skala tinggi</div><div class="num">${code}</div><div class="sub">${code==='Tidak dapat ditetapkan'?'Elevasi tidak memadai':'Hipotesis code-type, bukan diagnosis'}</div></div></div><div class="card report" style="margin-top:18px"><div class="notice">${state.mode==='demo'?'<b>PROFIL FIKTIF:</b> Seluruh skor pada halaman ini adalah data contoh yang dibuat untuk mendemonstrasikan antarmuka dan tidak berasal dari 567 jawaban Anda.':'<b>INPUT MANUAL:</b> Periksa sumber norma, versi instrumen, koreksi K, dan laporan skor profesional sebelum menggunakan interpretasi.'} <b>Tidak diperkenankan</b> menyimpulkan kelayakan kerja dari laporan ini.</div><section><h3>I. Executive Summary</h3><p>Jenis laporan: <b>${state.mode==='demo'?'simulasi profil fiktif':'telaah T-score yang dimasukkan pengguna'}</b>. Kelengkapan butir dalam aplikasi: ${count()}/567; nilai tersebut tidak membuktikan kelengkapan administrasi MMPI-2 resmi.</p><p>Status validitas: <b>${v.status}</b>. ${v.desc}</p>${reportAllowed?`<p>Skala paling menonjol dalam profil ilustratif: ${elevated.slice(0,3).map(x=>`${x.k} (T=${x.n})`).join(', ')||'tidak terdapat elevasi ≥ 65 pada skala terpilih'}. Pola ini hanya dasar hipotesis yang perlu diuji melalui wawancara dan data kontekstual.</p>`:'<p><b>Penafsiran substantif ditangguhkan</b> karena terdapat persoalan validitas yang perlu diklarifikasi.</p>'}</section><section><h3>II. Data Completeness & Test Administration</h3><div class="tablewrap"><table class="table"><tr><th>Komponen</th><th>Ketersediaan</th><th>Catatan</th></tr>${[['Versi instrumen','Referensi MMPI-2','Aplikasi ini berupa simulasi, bukan administrasi berizin'],['Tanggal administrasi','Tidak tersedia','Tanggal pengisian resmi perlu diverifikasi'],['Respons butir',count()+'/567','Data lokal; tidak dilakukan skoring'],['T-score',state.mode==='demo'?'Fiktif':'Dimasukkan pengguna','Tidak diturunkan dari jawaban di aplikasi'],['Norma','Tidak tersedia','Norma dan populasi rujukan harus ditentukan'],['Kunci dan algoritme skoring','Tidak tersedia','Koreksi K tidak dihitung'],['Kondisi administrasi','Tidak tersedia','Perlu dikonfirmasi oleh administrator']].map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table></div></section><section><h3>III. Validity Scale Analysis</h3><p>Skala validitas harus diperiksa terlebih dahulu. Hasil di bawah menggambarkan kategori screening edukasional; satu skala yang tinggi tidak membuktikan kebohongan atau manipulasi tes.</p><div class="tablewrap"><table class="table"><thead><tr><th>Skala</th><th>T-score</th><th>Fokus</th><th>Catatan evaluasi</th></tr></thead><tbody>${[['L','Presentasi diri terlalu ideal','Perhatikan kemungkinan defensivitas dan standar moral tinggi'],['F','Jawaban tidak lazim','Perlu membedakan distress, variasi populasi, dan respons tidak konsisten'],['Fb','Jawaban tidak lazim pada bagian akhir','Bandingkan dengan F serta kemungkinan kelelahan'],['K','Defensivitas dan keterbukaan','Tidak bermakna sebagai bukti ketidakjujuran'],['VRIN','Inkoherensi pola jawaban','Peningkatan dapat mengindikasikan respons tidak konsisten'],['TRIN','Kecenderungan respons Benar/Salah','Perlu arah respons dan algoritme resmi'],['S','Presentasi diri sangat positif','Perlu telaah konteks seleksi']].map(r=>`<tr><td>${r[0]}</td><td>${scoreVal(r[0])??'—'}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div><p><b>Cannot Say (?):</b> ${567-count()} butir belum diisi <em>di aplikasi</em>. Ini bukan nilai Cannot Say dari administrasi resmi. Rentang cut-off yang dicontohkan dalam literatur lama tidak boleh diterapkan sebagai keputusan otomatis.</p></section><section><h3>IV. Clinical Scale Profile</h3><div class="bars" style="margin:17px 0 25px">${clinical.map(x=>`<div class="barrow"><b>${x.k} · ${x.name.slice(0,16)}</b><div class="track"><i style="width:${Math.max(0,Math.min(100,(x.n??0)/110*100))}%"></i></div><b>${x.n??'—'}</b></div>`).join('')}</div><div class="tablewrap"><table class="table"><thead><tr><th>Skala</th><th>T-score</th><th>Kategori</th><th>Interpretasi dan kehati-hatian</th></tr></thead><tbody>${clinical.map(x=>`<tr><td>${x.k} · ${x.name}</td><td>${x.n??'—'}</td><td><span class="flag ${assess(x.k,x.n)[1]}">${assess(x.k,x.n)[0]}</span></td><td>${x.desc}. ${!reportAllowed?'Interpretasi substantif ditunda sampai validitas diperjelas.':x.n!==null&&x.n>=58?x.comment:x.n!==null&&x.n<40?'Skor relatif rendah; tidak dapat diartikan sebagai tidak adanya gejala tanpa informasi lain.':'Tidak tampak elevasi pada indikator ini; tidak meniadakan kemungkinan masalah di luar cakupan skala.'}</td></tr>`).join('')}</tbody></table></div></section><section><h3>V. Code-Type Analysis</h3>${reportAllowed&&code!=='Tidak dapat ditetapkan'?`<p>Dua elevasi teratas yang digunakan untuk hipotesis: <b>${elevated[0].name} (${elevated[0].k}, T=${elevated[0].n})</b> dan <b>${elevated[1].name} (${elevated[1].k}, T=${elevated[1].n})</b>. Pasangan ini menggambarkan domain yang perlu diperdalam secara bersama, bukan gabungan diagnosis.</p><p>${elevated[0].comment} ${elevated[1].comment}</p><p>Perlu memeriksa apakah pasangan tersebut memenuhi kriteria elevasi, pemisahan dari skala lain, stabilitas profil, dan bukti validitas code type pada populasi yang dinilai. Narasi code type tidak boleh dipakai secara mekanis.</p>`:`<p>Code type yang dapat dipertanggungjawabkan <b>tidak ditetapkan</b>, karena ${v.warn?'validitas belum memenuhi prasyarat interpretasi':'jumlah atau besar elevasi yang tersedia tidak mencukupi'}. Skala 5 dan 0 diperlakukan terpisah dalam penentuan pasangan dominan pada demonstrasi ini.</p>`}</section><section><h3>VI. Integrated Psychological Formulation</h3>${reportAllowed?`<p>Formulasi kerja hanya menggambarkan kemungkinan pola psikologis. ${elevated.length?`Dalam data contoh, domain yang relatif paling menonjol adalah ${elevated.slice(0,3).map(x=>x.desc.toLowerCase()).join('; ')}.`:'Tidak terdapat elevasi menonjol yang cukup untuk merumuskan pola klinis dominan.'} Ini bukan kepastian adanya gangguan atau ciri kepribadian permanen.</p><p>Aspek regulasi emosi, pengalaman stres, relasi interpersonal, aktivitas harian, fungsi tidur, keluhan kesehatan, serta dampak pekerjaan perlu dikonfirmasi dengan informasi independen. Profil dapat dipengaruhi kondisi sementara, perbedaan bahasa, dan gaya menjawab.</p>`:'<p>Tidak disusun formulasi klinis substantif karena terlebih dahulu perlu memeriksa kelayakan interpretasi protokol.</p>'}</section><section><h3>VII. Occupational Contextualization</h3><p>Untuk konteks kerja, hasil klinis tidak sama dengan pengukuran langsung atas kompetensi, integritas, produktivitas, kolaborasi, atau kepemimpinan. Kecocokan jabatan tidak bisa diputuskan hanya melalui profil MMPI-2.</p><p>Informasi yang sebaiknya diperiksa secara terpisah meliputi deskripsi pekerjaan, evaluasi kompetensi yang tervalidasi, wawancara terstruktur, bukti perilaku kerja, serta akomodasi yang relevan. Informasi kesehatan mental harus diperlakukan dengan pembatasan akses dan prinsip non-diskriminasi.</p></section><section><h3>VIII. Strength of Evidence & Uncertainty</h3><div class="tablewrap"><table class="table"><thead><tr><th>Temuan</th><th>Data pendukung</th><th>Alternatif penjelasan</th><th>Keyakinan</th></tr></thead><tbody><tr><td>Jumlah jawaban terisi</td><td>Data lokal ${count()}/567</td><td>Belum berarti tes resmi terlaksana</td><td> Tinggi (hanya perhitungan teknis)</td></tr><tr><td>Profil T-score</td><td>${state.mode==='demo'?'Skor fiktif':'Angka yang dimasukkan manual'}</td><td>Kesalahan input, norma berbeda</td><td>${state.mode==='demo'?'Tidak berlaku untuk individu':'Belum dapat diverifikasi'}</td></tr><tr><td>Validitas klinis</td><td>7 indikator yang tersedia</td><td>Skala lain, konteks, dan prosedur</td><td>Belum dapat diverifikasi</td></tr><tr><td>Pola klinis/code type</td><td>Elevasi relatif dan literatur historis</td><td>Stres, kesehatan, bahasa, budaya, respons</td><td>Rendah / hipotesis</td></tr><tr><td>Prediksi performa kerja</td><td>Tidak ada kriteria jabatan tervalidasi</td><td>Banyak determinan nonklinis</td><td>Tidak dapat dinilai</td></tr></tbody></table></div></section><section><h3>IX. Follow-Up Recommendations</h3><ul><li>Pastikan administrasi dilakukan oleh profesional berwenang, menggunakan adaptasi bahasa dan izin yang sesuai.</li><li>Peroleh profil skor dari sistem resmi, lengkap dengan norma, koreksi, dan indikator validitas.</li><li>Kaji ketidakcocokan atau elevasi skala validitas sebelum membahas hipotesis klinis.</li><li>Jika terdapat distres atau kekhawatiran keselamatan, lakukan wawancara klinis yang tepat dan penilaian risiko langsung; jangan menyimpulkan risiko hanya dari satu respons item.</li><li>Gabungkan hasil dengan anamnesis, observasi, bukti kolateral yang sah, dan kebutuhan asesmen yang jelas.</li><li>Untuk penggunaan rekrutmen, libatkan profesional yang memiliki kewenangan serta instrumen asesmen kompetensi yang terkait jabatan.</li></ul></section><section><h3>X. Professional Conclusion</h3><p><b>Kesimpulan:</b> ${state.mode==='demo'?'Profil ini adalah ilustrasi pembelajaran untuk menunjukkan tata cara membaca skala, bukan hasil pemeriksaan seseorang.':'Data skor yang dimasukkan hanya dapat digunakan untuk penelaahan awal dan memerlukan verifikasi sumber skoring resmi.'} ${v.desc}</p><p>Tidak terdapat dasar untuk membuat diagnosis klinis, keputusan penerimaan/penolakan kerja, ataupun penilaian integritas. Semua interpretasi resmi wajib ditinjau oleh psikolog atau psikiater yang kompeten menggunakan MMPI-2.</p></section></div>`)}
function updateScore(k,v){state.scores[k]=v===''?null:Math.max(0,Math.min(140,Number(v)));persist();render()}
function method(){return page('Metodologi & Batasan','Penjelasan struktur instrumen, simulasi, dan standar minimum untuk penggunaan profesional.',`<div class="stack"><div class="card"><h3 class="sectiontitle">Sumber dan cakupan</h3><p>Aplikasi ini memuat 567 nomor soal berdasarkan dokumen <b>MMPI-2 Test Questions</b> yang disediakan pengguna. Redaksi Indonesia merupakan <b>terjemahan nonresmi untuk simulasi</b>, bukan adaptasi instrumen yang telah dinilai kesetaraan semantik, validitas konstruk, maupun kesetaraan normanya.</p><p>Kerangka interpretasi merujuk dokumen <b>MMPI-2 Interpretation</b> (Grieve, revisi 2005) dan prinsip evaluasi kehati-hatian. Deskripsi historis yang berpotensi stereotip atau stigmatis tidak diperlakukan sebagai kepastian ilmiah terkini.</p></div><div class="card"><h3 class="sectiontitle">Mengapa tidak ada skoring otomatis?</h3><p>MMPI-2 bukan tes yang dapat dihitung berdasarkan persentase jawaban Benar atau Salah. Setiap skala menggunakan kunci butir khusus, sebagian skala menggunakan koreksi K, dan raw score memerlukan konversi norma yang sesuai. Kunci dan tabel konversi resmi tidak terdapat di lampiran. Menghasilkan skor dari asumsi akan menyesatkan.</p><div class="notice">Dashboard interpretasi hanya menerima <b>T-score contoh fiktif</b> atau <b>nilai profesional yang dimasukkan manual</b>. Pengisian 567 jawaban tidak mengubah profil dan tidak pernah menghasilkan skor MMPI-2 resmi.</div></div><div class="card"><h3 class="sectiontitle">Skala yang dibahas</h3><p><b>Validitas:</b> Cannot Say (?), L, F, Fb, K, VRIN, TRIN, S. <b>Klinis:</b> Hs, D, Hy, Pd, Mf, Pa, Pt, Sc, Ma, Si.</p><p>Sejumlah skala tambahan, subskala, serta indeks modern belum dimasukkan karena tidak ada laporan skoring resmi dalam sumber. Tidak ada diagnosis otomatis ataupun klaim bahwa T-score tertentu memastikan penyakit psikiatri.</p></div><div class="card"><h3 class="sectiontitle">Privasi dan kegunaan</h3><p>Respons disimpan pada <b>localStorage</b> peramban. Tidak ada backend, akun, pengiriman hasil, atau permintaan jaringan. Respons dapat diekspor sebagai JSON dan diimpor lagi. Membersihkan data situs dapat menghapus respons yang tersimpan. Hindari perangkat bersama ketika mengisi pertanyaan sensitif.</p></div></div>`)}
